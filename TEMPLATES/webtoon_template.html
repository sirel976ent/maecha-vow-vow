<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maecha VowVow - Épisode {EP} : {TITRE_EP}</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            font-family: 'Comic Neue', cursive;
            display: flex;
            justify-content: center;
        }

        .webtoon-container { width: 100%; max-width: 450px; background: #000; }

        /* HEADER */
        .episode-header {
            background: linear-gradient(135deg, #2E86AB, #1a1a2e);
            padding: 20px; text-align: center; color: white;
        }
        .episode-header h1 {
            font-family: 'Bangers', cursive; font-size: 2em;
            letter-spacing: 2px; color: #F6AE2D;
        }
        .episode-header h2 { font-size: 1.2em; font-weight: normal; margin-top: 5px; opacity: 0.9; }

        /* PANELS */
        .panel { position: relative; width: 100%; overflow: hidden; }
        .panel img { width: 100%; height: auto; display: block; }

        /* BULLES DIALOGUE (avec queue) */
        .bubble {
            position: absolute; background: white; border: 3px solid #000;
            border-radius: 20px; padding: 12px 16px; font-size: 14px;
            line-height: 1.4; max-width: 70%;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
        }
        .bubble::after {
            content: ''; position: absolute; bottom: -15px; left: 30px;
            border-width: 15px 10px 0; border-style: solid;
            border-color: white transparent transparent;
        }
        .bubble::before {
            content: ''; position: absolute; bottom: -20px; left: 28px;
            border-width: 18px 12px 0; border-style: solid;
            border-color: #000 transparent transparent;
        }
        .bubble.right::after { left: auto; right: 30px; }
        .bubble.right::before { left: auto; right: 28px; }

        /* BULLES PENSEE (avec ronds) */
        .bubble.thought { border-radius: 50%; font-style: italic; background: #f8f8f8; }
        .bubble.thought::after, .bubble.thought::before { display: none; }
        .bubble.thought .thought-dots { position: absolute; bottom: -25px; left: 20px; }
        .bubble.thought .thought-dots span {
            display: inline-block; background: #f8f8f8;
            border: 2px solid #000; border-radius: 50%; margin: 0 2px;
        }
        .bubble.thought .thought-dots span:nth-child(1) { width: 12px; height: 12px; }
        .bubble.thought .thought-dots span:nth-child(2) { width: 8px; height: 8px; }

        /* NARRATEUR */
        .narrator-box {
            position: absolute; background: #FFF8E7; border: 2px solid #8B7355;
            padding: 10px 15px; font-style: italic; font-size: 13px;
            max-width: 80%; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); color: #333;
        }

        /* SFX */
        .sfx {
            position: absolute; font-family: 'Bangers', cursive; font-size: 24px;
            color: #FF6B35; text-shadow: 2px 2px 0 #000, -1px -1px 0 #fff;
            transform: rotate(-5deg);
        }

        /* NOTIFICATION */
        .notification {
            position: absolute; background: linear-gradient(135deg, #5865F2, #7289DA);
            color: white; border-radius: 12px; padding: 8px 12px;
            font-size: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* TRANSITION */
        .transition-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: white; font-family: 'Bangers', cursive; font-size: 1.4em;
            letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center; width: 90%;
        }

        /* SEPARATEUR */
        .panel-separator { height: 5px; background: #1a1a2e; }

        /* FOOTER */
        .episode-footer {
            background: linear-gradient(135deg, #1a1a2e, #2E86AB);
            padding: 30px 20px; text-align: center; color: white;
        }
        .episode-footer .to-be-continued {
            font-family: 'Bangers', cursive; font-size: 2em;
            color: #F6AE2D; letter-spacing: 3px;
        }

        /* RESSOURCES (EP5) */
        .resources-box {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            margin: 15px; padding: 20px; border-radius: 15px; color: white;
        }
        .resources-box h3 { font-family: 'Bangers', cursive; margin-bottom: 15px; font-size: 1.3em; }
        .resources-box .resource-item {
            background: rgba(255,255,255,0.2); padding: 10px 15px;
            border-radius: 10px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 10px;
        }

        @media (max-width: 450px) {
            .bubble { font-size: 12px; padding: 10px 12px; }
            .sfx { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="webtoon-container">

        <!-- HEADER -->
        <div class="episode-header">
            <h1>MAECHA VOWVOW</h1>
            <h2>Épisode {EP} : {TITRE_EP}</h2>
        </div>

        <!-- TRANSITION OUVERTURE -->
        <div class="panel">
            <img src="../IMAGES/EP{EP}/{EP}_00.png" alt="Transition">
            <div class="transition-text">{TEXTE_TRANSITION}</div>
        </div>
        <div class="panel-separator"></div>

        <!-- PLANCHE — Dialogue -->
        <div class="panel">
            <img src="../IMAGES/EP{EP}/{EP}_01.png" alt="">
            <div class="bubble" style="top: 20px; left: 15px;">Dialogue personnage</div>
            <div class="bubble right" style="top: 140px; right: 15px;">Réponse</div>
        </div>
        <div class="panel-separator"></div>

        <!-- PLANCHE — Pensée -->
        <div class="panel">
            <img src="../IMAGES/EP{EP}/{EP}_02.png" alt="">
            <div class="bubble thought" style="top: 30px; left: 15px; max-width: 60%;">
                Pensée...
                <div class="thought-dots"><span></span><span></span></div>
            </div>
            <div class="narrator-box" style="bottom: 15px; right: 15px;">Narrateur...</div>
        </div>
        <div class="panel-separator"></div>

        <!-- PLANCHE — SFX -->
        <div class="panel">
            <img src="../IMAGES/EP{EP}/{EP}_03.png" alt="">
            <div class="sfx" style="top: 30px; right: 20px;">BOOM!</div>
            <div class="notification" style="top: 20px; left: 15px;">
                <span>🔔</span> Nouveau message
            </div>
        </div>
        <div class="panel-separator"></div>

        <!-- TRANSITION FIN -->
        <div class="panel">
            <img src="../IMAGES/EP{EP}/{EP}_XX.png" alt="Fin">
            <div class="transition-text">À suivre...</div>
        </div>

        <!-- FOOTER -->
        <div class="episode-footer">
            <div class="to-be-continued">À SUIVRE...</div>
            <p style="margin-top: 15px; opacity: 0.8;">Épisode {EP+1} : {TITRE_SUIVANT}</p>
        </div>

    </div>
</body>
</html>
